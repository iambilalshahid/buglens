[project]
name = "buglens"
version = "0.1.0"
description = "Reusable MCP to automate QA bugs from Google Sheets - reads FE bugs, fetches Snipboard screenshots for Gemini vision, and marks DevDone"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Dash"}]
dependencies = [
  "fastmcp>=0.4.0",
  "gspread>=6.0.0",
  "oauth2client>=4.1.3",
  "requests>=2.31.0"
]

[project.scripts]
qa-sheet-mcp = "qa_sheet_mcp.server:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]